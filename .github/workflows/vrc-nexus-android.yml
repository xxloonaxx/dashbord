name: VRC Nexus App (Android)

on:
  push:
    paths:
      - 'apps/vrc-nexus-android/**'
      - 'apps/vrc-nexus/backend/**'
      - 'apps/vrc-nexus/renderer/**'
      - '.github/workflows/vrc-nexus-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Abhängigkeiten
        working-directory: apps/vrc-nexus-android
        run: npm ci
      - name: Oberfläche + Backend bündeln
        working-directory: apps/vrc-nexus-android
        run: node build.mjs
      - name: Android-Projekt erzeugen
        working-directory: apps/vrc-nexus-android
        run: |
          npx cap add android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r resources/android/* android/app/src/main/res/
          sed -i 's/versionName "1.0"/versionName "1.1.0"/' android/app/build.gradle
          npx cap sync android
      - name: APK bauen
        working-directory: apps/vrc-nexus-android/android
        run: ./gradlew assembleDebug --no-daemon
      - name: APK umbenennen
        run: cp apps/vrc-nexus-android/android/app/build/outputs/apk/debug/app-debug.apk VRC-Nexus-1.1.0-android.apk
      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: VRC-Nexus-Android
          path: |
            VRC-Nexus-1.1.0-android.apk
            apps/vrc-nexus-android/README.md
