name: VRC Nexus App (Android)

on:
  push:
    paths:
      - 'apps/vrc-nexus-android/**'
      - 'apps/vrc-nexus/backend/**'
      - 'apps/vrc-nexus/renderer/**'
      - '.github/workflows/vrc-nexus-android.yml'
  workflow_dispatch:

permissions:
  contents: write      # für das automatische GitHub-Release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Abhängigkeiten
        working-directory: apps/vrc-nexus-android
        run: npm ci
      - name: Oberfläche + Backend bündeln
        working-directory: apps/vrc-nexus-android
        run: node build.mjs
      - name: Android-Projekt erzeugen
        working-directory: apps/vrc-nexus-android
        run: |
          npx cap add android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r resources/android/* android/app/src/main/res/
          sh native/install.sh
          VER=$(node -p "require('./package.json').version")
          sed -i "s/versionName \"1.0\"/versionName \"$VER\"/" android/app/build.gradle
          CODE=$(node -p "const [a,b,c]=require('./package.json').version.split('.').map(Number); a*10000+b*100+c")
          sed -i "s/versionCode 1$/versionCode $CODE/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          npx cap sync android
      - name: Festen Signierschlüssel verwenden (Updates über die installierte App)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nexus.keystore"
            echo "NEXUS_KEYSTORE=$RUNNER_TEMP/nexus.keystore" >> "$GITHUB_ENV"
            # die Debug-Signatur ausdrücklich auf den festen Schlüssel umstellen
            cat >> apps/vrc-nexus-android/android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getenv('NEXUS_KEYSTORE'))
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE
            echo "Fester Schlüssel aus dem Secret ANDROID_KEYSTORE_B64 wird verwendet."
          else
            echo "::warning::Secret ANDROID_KEYSTORE_B64 fehlt – die APK bekommt einen zufälligen Schlüssel und lässt sich nicht über eine ältere Version installieren."
          fi
      - name: APK bauen
        working-directory: apps/vrc-nexus-android/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Signatur prüfen
        run: |
          APK=apps/vrc-nexus-android/android/app/build/outputs/apk/debug/app-debug.apk
          GOT=$(keytool -printcert -jarfile "$APK" | grep -m1 'SHA256:' | awk '{print $2}')
          echo "APK-Zertifikat: $GOT"
          if [ -n "$NEXUS_KEYSTORE" ]; then
            WANT=$(keytool -list -v -keystore "$NEXUS_KEYSTORE" -storepass android -alias androiddebugkey | grep -m1 'SHA256:' | awk '{print $2}')
            echo "Erwartet:       $WANT"
            [ "$GOT" = "$WANT" ] || { echo "::error::APK ist nicht mit dem festen Schlüssel signiert"; exit 1; }
          fi
      - name: APK umbenennen
        run: cp apps/vrc-nexus-android/android/app/build/outputs/apk/debug/app-debug.apk "VRC-Nexus-$(node -p "require('./apps/vrc-nexus-android/package.json').version")-android.apk"
      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: VRC-Nexus-Android
          path: |
            VRC-Nexus-*-android.apk
            apps/vrc-nexus-android/README.md
      - name: GitHub-Release aktualisieren
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          VER=$(node -p "require('./apps/vrc-nexus-android/package.json').version")
          TAG="vrc-nexus-v$VER"
          MSG=$(printf '%s' "$HEAD_MSG" | head -n 1)
          NOTES=$(printf '%s\n' "## VRC Nexus $VER" "" \
            "| Datei | Wofür |" "|---|---|" \
            "| VRC-Nexus-$VER-Setup.exe | Windows-Installer |" \
            "| VRC-Nexus-$VER-portable.exe | Windows ohne Installation |" \
            "| VRC-Nexus-$VER-android.apk | Android (ohne PC-Funktionen) |" \
            "| VRC-Nexus.streamDeckPlugin | Stream-Deck-Plugin (Doppelklick installiert) |" "" \
            "Die Dateien sind nicht signiert: Windows SmartScreen → „Weitere Informationen“ → „Trotzdem ausführen“; Android fragt nach „Installation aus unbekannten Quellen“." "" \
            "Stand: ${GITHUB_SHA:0:7} vom $(date -u '+%d.%m.%Y %H:%M') UTC – $MSG")
          if ! gh release view "$TAG" -R "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" -R "$REPO" --target "$GITHUB_SHA" --title "VRC Nexus $VER" --notes "$NOTES" || sleep 15
          fi
          gh release upload "$TAG" -R "$REPO" --clobber VRC-Nexus-*-android.apk
          gh release edit "$TAG" -R "$REPO" --notes "$NOTES"
